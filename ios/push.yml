# Included only with ENABLE_PUSH=true (needs a paid team: free teams can't sign aps-environment).
targets:
  LockActivity:
    entitlements:
      path: App/LockActivity.entitlements
      properties:
        aps-environment: development
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) PUSH
    # APP_SECRET (server/.env) lives in the gitignored Secrets.xcconfig: this repo is public
    configFiles:
      Debug: Secrets.xcconfig
      Release: Secrets.xcconfig
    info:
      properties:
        AppSecret: $(APP_SECRET)
