name: LockActivity
include:
  - path: push.yml
    enable: ${ENABLE_PUSH}
options:
  bundleIdPrefix: com.andriyor
  deploymentTarget:
    iOS: "17.2"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: A9GA52LYQQ
    CODE_SIGN_STYLE: Automatic
targets:
  LockActivity:
    type: application
    platform: iOS
    sources: [App, Shared]
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSSupportsLiveActivities: true
        UILaunchScreen: {}
        ServerURL: $(SERVER_URL)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Sends Live Activity push tokens to your server.
    dependencies:
      - target: LockWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andriyor.LockActivity
        SERVER_URL: http://LM-GY2D3NPRGW.local:8787
  LockWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andriyor.LockActivity.LockWidget
